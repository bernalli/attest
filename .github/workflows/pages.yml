name: site
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            verifiers/ts/package-lock.json
            site/package-lock.json
      - run: npm ci --prefix verifiers/ts
      - run: npm run build --prefix verifiers/ts
      - run: npm test --prefix verifiers/ts
      - run: npm ci --prefix site
      # The guard below is pointed at defects it must name before it is trusted to have
      # found none. A check that has only ever been seen passing is not known to catch
      # anything — the same reason gate G1 in desktop/test carries a negative self-test.
      - run: python3 tools/check_test_census.py --selftest
      # The suite's total is ASSERTED, not printed. `site/test/rail-state.property.test.ts`
      # imported `desktop/src/app.ts`; this job installs site/node_modules and not
      # desktop/node_modules, so `attest-verifier` did not resolve and vitest collected
      # zero tests from the file. Sixteen assertions ran on developer machines and in no
      # job here, and the only trace was a total that went UP — the ten new unit tests
      # more than covered the eight that vanished. A number nobody compares is not a
      # gate; tools/test-census.json is the comparison.
      - run: |
          npm test --prefix site -- --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/site-tests.json"
      - run: python3 tools/check_test_census.py site --report "$RUNNER_TEMP/site-tests.json"
      - run: npm run build --prefix site
      # The two container readers are judged against each other on archives
      # nobody chose. A disagreement here is the defect the canonical reader
      # exists to close — same bytes, two conforming verifiers, two answers —
      # so it fails the build rather than waiting for a field report. Stdlib
      # Python plus the site's own esbuild: no extra install.
      - run: python3 tools/container_differential.py --count 500 --seed 20260902
      - run: cd site && npx playwright install --with-deps chromium
      - run: npm run e2e --prefix site
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  # The desktop verifier borrows site/src modules by relative path, so its suite is the
  # only thing that notices when a change here breaks that seam — in particular the pin
  # that the site still emits exactly one .verdict node, which the desktop card replaces
  # to remove the binary headline.
  #
  # This job used to declare `needs: test`, and that made it blind on exactly the change
  # it exists to catch. A commit that edits a SHARED source — site/src/intake.ts is the
  # case that produced this comment — can leave the site suite red and the desktop suite
  # is then never asked: GitHub reports it `skipping`, which reads like "not affected"
  # rather than "not measured". The two shells are two verdicts on the same shared code
  # and each has to reach its own. It rebuilds verifiers/ts itself (below), so it needed
  # nothing from that job but the ordering.
  #
  # The build is part of the gate: `npm run e2e` opens the BUILT artifact over file://,
  # so a job that skipped the build would have nothing to open.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            verifiers/ts/package-lock.json
            site/package-lock.json
            desktop/package-lock.json
      - run: npm ci --prefix verifiers/ts
      - run: npm run build --prefix verifiers/ts
      # desktop's tsconfig includes ../site/src, so the typecheck reads the site's
      # imports and needs the site's modules on disk. Without this the job is green on
      # a developer machine that has them from other work and red here, which is the
      # wrong way round: CI is the one that should notice first.
      - run: npm ci --prefix site
      - run: npm ci --prefix desktop
      - run: npm run typecheck --prefix desktop
      # Same assertion the site job makes on its own suite, for the same reason: this is
      # where the eight desktop rail-transition assertions now live, and their dependency
      # — the desktop app, and through it attest-verifier — is installed here.
      - run: |
          npm test --prefix desktop -- --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/desktop-tests.json"
      - run: python3 tools/check_test_census.py desktop --report "$RUNNER_TEMP/desktop-tests.json"
      - run: npm run build --prefix desktop
      # All three engines here, and the install must SUCCEED: a cross-browser gate that
      # skips when a browser is missing produces a green nobody earned. WebKit runs only
      # in CI — playwright.config.ts adds it when CI is set — because installing its
      # system libraries pulls in over two hundred packages, and WebKit-on-Linux
      # approximates Safari rather than being it. The real Safari check is manual, on a
      # Mac, before the artifact is announced.
      - run: cd desktop && npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e --prefix desktop

      # Same scanners, same pinned versions and the same allow-list the supply-chain job
      # already uses on the other two ecosystems. No new scanner is introduced: the point
      # of this package is that it adds no dependency the repository did not already
      # carry, and the SBOM is how that is checked rather than asserted.
      - name: Install syft, grype, grant (pinned)
        env:
          SYFT_VERSION: v1.46.0
          GRYPE_VERSION: v0.115.0
          GRANT_VERSION: v0.6.8
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh"  | sh -s -- -b "$HOME/.local/bin" "${SYFT_VERSION}"
          curl -sSfL "https://raw.githubusercontent.com/anchore/grype/${GRYPE_VERSION}/install.sh" | sh -s -- -b "$HOME/.local/bin" "${GRYPE_VERSION}"
          curl -sSfL "https://raw.githubusercontent.com/anchore/grant/${GRANT_VERSION}/install.sh" | sh -s -- -b "$HOME/.local/bin" "${GRANT_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: SBOM, vulnerability and licence gate for desktop
        run: |
          npm ci --omit=dev --prefix desktop
          syft dir:desktop -o cyclonedx-json=sbom-desktop.cdx.json
          grype sbom:sbom-desktop.cdx.json --fail-on high
          grant check -c .grant.yaml sbom-desktop.cdx.json

      # The artifact and its checksum, so the local build can be compared with the one CI
      # produced. That comparison is what turns "the build is not self-randomising" into
      # "the build is reproducible across machines", which is what a published checksum
      # needs to mean.
      - name: Record the artifact checksum
        run: sha256sum desktop/dist/attest-verifier.html | tee desktop/dist/attest-verifier.html.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-verifier
          path: |
            desktop/dist/attest-verifier.html
            desktop/dist/attest-verifier.html.sha256
            sbom-desktop.cdx.json

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
