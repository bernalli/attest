# .github/workflows/ci.yml
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    # BEFORE CHANGING HOW THIS JOB RUNS — a `container:`, a self-hosted runner,
    # a different image — read this. Thirteen tests in the suite skip on
    # properties of the machine that nothing here declares: one needs the
    # process NOT to be root (root bypasses the file permissions it checks),
    # and twelve need a filesystem with hardlinks and symlinks. A hosted
    # ubuntu-latest runner gives both. A container image runs as root by
    # default, which alone removes the first; an overlay or a restricted mount
    # removes the other twelve. None of them turns red when that happens —
    # the suite's total simply drops. So measure the number of skips before
    # and after any such change, and do not read the green as unchanged
    # coverage. These are not the prerequisites `ATTEST_CI_REQUIRED` covers:
    # those a job can install, these it cannot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
      # Two gates in this suite compare this implementation with the other one,
      # and both need the TypeScript side on disk: the container differential
      # (bundled with the site's own esbuild) and the witness cross-core bench
      # (a built verifiers/ts). Until these steps existed neither one failed
      # here — they SKIPPED, and one skip in a total of four thousand passes is
      # indistinguishable from a test that ran. The jobs that build the
      # TypeScript side never run pytest, so without these steps pytest can
      # perform neither comparison. The witness comparison has no other
      # caller; the site workflow separately runs the container differential.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            verifiers/ts/package-lock.json
            site/package-lock.json
      - run: npm ci --prefix verifiers/ts
      # The site depends on verifiers/ts by relative path, so it is built first.
      - run: npm run build --prefix verifiers/ts
      # The site install is deliberate redundancy, not new coverage: the site
      # workflow already runs the differential at 500 archives with this seed,
      # and pytest's 50 are that run's prefix. What it buys is that `pytest`
      # measures on its own — a suite whose gate is satisfied by a different
      # workflow is a suite that reports a verdict it did not reach. It costs
      # one npm install and a third of a second.
      - run: npm ci --prefix site
      # `dev` is a PEP 621 optional-dependency extra, not a PEP 735 group:
      # bare `uv sync --locked` installs runtime deps only. Use --extra dev
      # to get pytest/ruff/mypy.
      - run: uv sync --locked --extra dev --all-packages
      # This job installed the other core above, so it is the job entitled to
      # demand it: the variable is the promise, and the tests that would
      # otherwise skip for a missing prerequisite fail here instead. A generic
      # `CI` would be the wrong signal — every runner exports it, so any of
      # them would inherit an obligation this workflow alone made.
      - run: uv run --frozen pytest -q
        env:
          ATTEST_CI_REQUIRED: "1"
      - run: uv run --frozen ruff check .
      # Formatting is a gate, not a courtesy: without this check the tree
      # drifts silently, and it had — four files had never been formatted.
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy --strict src bridge/src witness/src
      - run: uv run --frozen python tools/check_spec_docs.py
      # The container corpus is generated, and a corpus edited by hand is a
      # corpus nobody can regenerate: this fails on any drift between the
      # committed leaves and what the generator produces today.
      - run: uv run --frozen python tools/gen_container_corpus.py --check
      # The container differential compares the two container READERS, and the
      # site workflow runs it at 500 archives; this one compares the two
      # IMPORTERS, which wrap those readers in different budgets and reach them
      # by different doors. An archive can pass through both readers identically
      # and still be imported by one and refused by the other — the proposition
      # the specification denies in §14.4 — so the reader differential cannot
      # see that class of defect at all. It is the only gate that can, it had no
      # caller anywhere in CI, and at its own defaults it costs under four
      # seconds (measured). Unlike the reader differential it needs the Python
      # package installed, not just stdlib, which is why it belongs to this job
      # and not to the site workflow: this is the only job that has both the
      # built TypeScript side and the Python environment on disk.
      - run: uv run --frozen python tools/importer_differential.py
      # Same reason, for the corpus that pins the protocol itself. Replaying
      # the committed leaves never re-runs the asserts the generator makes
      # while minting them, so without this the vectors are the one generated
      # artifact with no link to the source that produced them.
      - run: uv run --frozen python tools/gen_vectors.py --check
      # The demos are how the project answers "does this actually run?".
      # The pytest wrappers already assert their outcomes, but running them
      # as scripts is the claim being made — that someone can type this from
      # a shell — and a claim nothing executes decays quietly.
      - run: uv run --frozen python -m demo.store_dies
      - run: uv run --frozen python -m demo.pledge_dies
      # Builds the Internet-Draft snapshot source (ietf/) with the pinned,
      # inline-references-only xml2rfc v3 toolchain (ietf/README.md). uvx is
      # already available here via astral-sh/setup-uv above, so no extra
      # install step is needed. The `cp` step works around a naming quirk in
      # xml2rfc 3.34.0 (output basename tracks the source filename, not the
      # docName attribute; ietf/README.md explains it in full) so the build
      # produces the exact `-00`-suffixed filename this step checks for.
      # --no-network keeps the build reproducible: every reference is an
      # inline <reference> element, never an xi:include from bib.ietf.org.
      - name: Build Internet-Draft (pinned toolchain)
        run: |
          cp ietf/draft-martinalli-open-purchase-receipts.xml \
            "$RUNNER_TEMP/draft-martinalli-open-purchase-receipts-00.xml"
          uvx --from xml2rfc==3.34.0 xml2rfc \
            "$RUNNER_TEMP/draft-martinalli-open-purchase-receipts-00.xml" \
            --text --path "$RUNNER_TEMP" --no-network
          test -s "$RUNNER_TEMP/draft-martinalli-open-purchase-receipts-00.txt"

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: verifiers/ts/package-lock.json

      # --- Install Anchore CLIs (pinned) ---
      - name: Install syft, grype, grant (pinned)
        env:
          SYFT_VERSION: v1.46.0
          GRYPE_VERSION: v0.115.0
          GRANT_VERSION: v0.6.8
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh"  | sh -s -- -b "$HOME/.local/bin" "${SYFT_VERSION}"
          curl -sSfL "https://raw.githubusercontent.com/anchore/grype/${GRYPE_VERSION}/install.sh" | sh -s -- -b "$HOME/.local/bin" "${GRYPE_VERSION}"
          curl -sSfL "https://raw.githubusercontent.com/anchore/grant/${GRANT_VERSION}/install.sh" | sh -s -- -b "$HOME/.local/bin" "${GRANT_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --- Build + assert Python artifacts ---
      - run: uv build
      - name: Assert Python artifact contents
        run: |
          uv run --frozen python tools/assert_artifacts.py \
            --wheel dist/*.whl --sdist dist/*.tar.gz

      # --- Build + assert npm tarball ---
      - run: npm ci --prefix verifiers/ts
      - run: npm run build --prefix verifiers/ts
      - name: Assert npm tarball contents
        run: |
          (cd verifiers/ts && npm pack --json > /tmp/pack.json)
          uv run --frozen python tools/assert_artifacts.py --npm-pack-json /tmp/pack.json

      # --- Conformance dogfood: TS verifier through the PUBLIC runner ---
      # `verifiers/ts/dist/` was already built above (npm run build, for the
      # tarball assert); `python3` is on every hosted runner and the runner
      # itself is stdlib-only. This is the same public path a third-party
      # implementation's own CI would run — see docs/conformance.md.
      - name: Conformance dogfood — TS verifier through the public runner
        run: |
          python3 tools/conformance_runner.py \
            --adapter "node tools/conformance_adapter_ts.mjs {leaf}" \
            --subset v0.2

      # --- SBOM (syft) for each ecosystem, runtime deps only ---
      - name: Generate SBOMs
        run: |
          uv sync --locked
          syft dir:.venv -o cyclonedx-json=sbom-python.cdx.json
          (cd verifiers/ts && npm ci --omit=dev)
          syft dir:verifiers/ts -o cyclonedx-json=sbom-npm.cdx.json

      # --- Vulnerability gate (grype): fail on High + Critical ---
      - name: Vulnerability scan (grype)
        run: |
          grype sbom:sbom-python.cdx.json --fail-on high
          grype sbom:sbom-npm.cdx.json --fail-on high

      # --- License gate (grant): permissive allow-list ---
      - name: License scan (grant)
        run: |
          grant check -c .grant.yaml sbom-python.cdx.json
          grant check -c .grant.yaml sbom-npm.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: |
            sbom-python.cdx.json
            sbom-npm.cdx.json

  # Formal-verification gate: proves formal/attest.spthy with the pinned
  # toolchain and gates through tools/check_formal.py (statement digests,
  # census, version pins — fail-closed).
  #
  # SHARD <-> CONTRACT COUPLING: the five `lemmas` lists below must be
  # pairwise disjoint and their union must equal tools.check_formal.CONTRACT
  # exactly. tests/tools/test_check_formal.py (the `_ci_formal_shards` tests)
  # parses THIS file and enforces both properties, so a lemma added to
  # CONTRACT without a shard assignment turns the pytest job red. That parser
  # is deliberately shape-coupled: keep each list a single-line
  # `lemmas: "name,name,..."` value under a `- shard:` entry.
  #
  # Shard split rationale (measured local prover costs, task-6 ledger):
  # no_downgrade_revocation_allhybrid (~829s) and acceptance_issuer_signed
  # (~602s) are scheduled long-runners and get their own shards; the
  # revocation chain is the next-heaviest cluster and is split in TWO —
  # one tamarin process proving all 14 revocation lemmas peaked at 8.2 GB
  # locally (measured) and was twice OOM-killed on hosted runners at the same
  # progression point ("runner has received a shutdown signal", 2026-07-22);
  # `rest` is every remaining
  # CONTRACT lemma. The checker gets a per-shard timeout 300 seconds below
  # the runner timeout, so it terminates the prover and reports its own
  # fail-closed error before the runner hard-kill; timeout-minutes remains the
  # backstop. Never continue-on-error, never || true.
  formal:
    # Stable check-run name: the auto-generated matrix name embeds timeouts and
    # the full lemma list and is truncated by GitHub at 100 chars — useless as
    # a required-status-check context. Branch protection pins these names.
    name: formal (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast off so a red run reports every failing shard, not only the
      # first; each shard remains an independent hard failure.
      fail-fast: false
      matrix:
        include:
          - shard: heavy-revdowngrade
            timeout: 120
            checker_timeout: 6900
            lemmas: "no_downgrade_revocation_allhybrid"
          - shard: heavy-acceptance
            timeout: 120
            checker_timeout: 6900
            lemmas: "acceptance_issuer_signed"
          - shard: revocation-core
            timeout: 90
            checker_timeout: 5100
            lemmas: "rev_record_authentic,revocation_auth_soundness,revoked_view_never_ok,attack_tofu_revocation_forgery"
          - shard: revocation-classes
            timeout: 90
            checker_timeout: 5100
            lemmas: "sanity_revocation_honored,sanity_none_ignored,sanity_issued_receipt_revoked,reach_refund_window_honored,reach_revocation_out_of_window,revocation_effectiveness,irrevocability_none,refund_window_bound,sanity_hybrid_revocation_admitted,rev_pq_sig_source"
          - shard: rest
            timeout: 90
            checker_timeout: 5100
            lemmas: "sanity_toolchain,sanity_v01_accept,sanity_rotate_then_accept,sanity_mixed_keyset,sanity_kid_bound_accept,sanity_retired_key_receipt_still_accepts,sanity_slot2_issue_and_compromise,sanity_attacker_distinct_mid,sanity_same_version_conflict,sanity_continuity_advance,sanity_accept_after_advance,sanity_multihop_advance_compromise,sanity_hybrid_accept,reach_rotation_nonactive_signer_flagged,reach_rotation_same_version_flagged,reach_rotation_gap_flagged,reach_compromised_receipt_submitted,verified_clean_head_honest,rotation_no_hijack,compromised_key_rejected,old_key_powerless,pq_receipt_sig_source,no_cross_version_confusion,attack_v01_post_crqc,attack_tofu_forgery,attack_mixed_keyset_hijack,sanity_artifact_manifest_accept,am_pq_sig_source,no_downgrade_artifact_manifest"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Both SHA256 values verified 2026-07-22 against the official release
      # assets (recomputed locally from fresh downloads; they match the plan).
      # Maude must be installed before Tamarin runs: tamarin-prover invokes
      # the `maude` binary from PATH, and the checker version-pins both.
      - name: Install Maude 3.5.1 (SHA-pinned)
        run: |
          curl -fsSL -o maude.zip https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          echo "72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c  maude.zip" | sha256sum -c -
          unzip -q maude.zip -d "$HOME/maude"
          chmod +x "$HOME/maude/maude"
          echo "$HOME/maude" >> "$GITHUB_PATH"
      # The release tarball contains exactly one file: the `tamarin-prover`
      # binary at the archive root (verified with `tar tzf`).
      - name: Install Tamarin 1.12.0 (SHA-pinned)
        run: |
          curl -fsSL -o tamarin.tar.gz https://github.com/tamarin-prover/tamarin-prover/releases/download/1.12.0/tamarin-prover-1.12.0-linux64-ubuntu.tar.gz
          echo "201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6  tamarin.tar.gz" | sha256sum -c -
          tar xzf tamarin.tar.gz -C "$HOME"
          chmod +x "$HOME/tamarin-prover"
          echo "$HOME" >> "$GITHUB_PATH"
      - name: Prove and gate (shard ${{ matrix.shard }})
        timeout-minutes: ${{ matrix.timeout }}
        run: python3 tools/check_formal.py formal/attest.spthy --only "${{ matrix.lemmas }}" --timeout ${{ matrix.checker_timeout }}
