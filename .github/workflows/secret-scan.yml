name: secret-scan

# gitleaks over the commits each change adds: a pull request's base..head, a
# push to main's before..after. tree-scan.yml looks for this repository's own
# private term lists across the whole tree; this job looks for credentials
# (tokens, private keys, passwords) by shape, with gitleaks' default rules and
# the narrow exemptions in .gitleaks.toml.
#
# It needs no secret and writes nothing, so it runs the same way on a pull
# request from a fork as on a push. Event fields reach the script through env,
# never through an expression inside `run:`.

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The range base..head has to be in the clone to be scanned.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned by digest)
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The negative control runs before the gate it validates: a scanner only
      # ever seen passing is not known to catch anything.
      - name: Self-test the scan
        run: bash .github/scripts/secret-scan.sh --selftest
      - name: Scan the commits this change adds
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/secret-scan.sh
