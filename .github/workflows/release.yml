# .github/workflows/release.yml
name: release
on:
  # A tag push runs the workflow AS IT EXISTS AT THE PUSHED REF, not as it
  # exists on main. So none of the assertions below are a property of the
  # repository: they are a property of the commit someone chose to tag. Whoever
  # can push a tag can tag a commit whose release.yml has none of them, and this
  # file cannot defend against that -- the defence is branch/tag protection plus
  # a required review on this path, configured outside the repository. Read
  # every "must refuse" comment below with that scope in mind.
  #
  # It also means a defect found DURING a release cannot be fixed by editing
  # this file and re-running: the re-run replays the tagged commit. The registry
  # checks in `github-release` are placed before `gh release create` so that a
  # failure there leaves nothing half-made, but a false refusal at that point
  # has to be finished by hand.
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

defaults:
  run:
    # Without this key a `run:` step executes as `bash -e {0}`: -e, but NO
    # pipefail, so a pipeline reports the exit status of its LAST command only.
    # That is not a detail here. It is what let `curl … | sh` install nothing and
    # stay green (sh on empty stdin exits 0), and what let `sha256sum missing |
    # tee f` write an empty checksum file without failing. `shell: bash` is
    # `bash --noprofile --norc -eo pipefail {0}`, and every assertion below
    # assumes a failing command in a pipe fails the step.
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Nothing here pushes; `gh` authenticates with GH_TOKEN and only needs
          # the remote to name the repository. Leaving the token in
          # .git/config puts it within reach of every dependency lifecycle
          # script this job runs afterwards.
          persist-credentials: false
      - name: Assert tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')"
          NPM="$(grep -m1 '"version"' verifiers/ts/package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')"
          echo "tag=$TAG py=$PY npm=$NPM"
          test "$TAG" = "$PY" && test "$TAG" = "$NPM"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: verifiers/ts/package-lock.json
      - name: Install syft, grype, grant (pinned by installer digest)
        # These three binaries ARE the SBOM, vulnerability and license gate of the
        # release: everything downstream trusts them to refuse. They were fetched
        # by piping a URL into a shell, which means the gate itself arrived over
        # the least verified path in the file.
        #
        # Two links, both pinned here, because pinning one is not the same as
        # closing the chain and the difference is easy to write down wrongly.
        #
        # 1. The installer. A git tag can be repointed at other bytes while the
        #    version string stays the same -- the exact shape of the 2026-03
        #    supply chain compromise that is the reason this project does not
        #    use Trivy. Its SHA-256 is pinned below and checked before it runs.
        #
        # 2. The binary. Each installer verifies the asset it downloads against
        #    the release's own checksums.txt -- and picks WHICH asset from that
        #    same file, so checksums.txt is the sole trust root for the bytes we
        #    end up executing. It is an unsigned, mutable release asset that is
        #    not bound to any git ref: whoever can repoint a tag can replace it
        #    together with the binary it vouches for, and the installer would
        #    then verify a tampered pair against itself. syft's and grype's
        #    installers can check a cosign signature over that file, but only
        #    when passed -v (VERIFY_SIGN defaults to false) and only with cosign
        #    on PATH; grant's installer has no signature check at all -- its 704
        #    lines contain no occurrence of cosign. So the option does not even
        #    exist for one of the three, and the installed binaries are checked
        #    against digests recorded when these versions were reviewed instead.
        #
        # ubuntu-latest is linux/amd64; on any other architecture the binary
        # check fails closed rather than trusting whatever was downloaded.
        # Update all six digests in the same commit that moves a version, and
        # say so in the message.
        env:
          SYFT_VERSION: v1.46.0
          GRYPE_VERSION: v0.115.0
          GRANT_VERSION: v0.6.8
          SYFT_INSTALLER_SHA256: 8a277b4b4dc21809ecd9a0e4926f4d7319affc6451a607fdeb3e5e1fbd9bc573
          GRYPE_INSTALLER_SHA256: 8646f06a90b10ca64992c1809b4aa00c44e30b4f551f63c309b0b0ab66873556
          GRANT_INSTALLER_SHA256: 084c7de5bb7a28b79b37cd19ade5839a38dc0b93b291958b2ae113b2ab3de642
          SYFT_BINARY_SHA256: 574df1a0862ff88ad933be214e81069e35b17618a13e019f8f1c84fe063222a2
          GRYPE_BINARY_SHA256: 05ffd2c28a607e48fb2269d9aac5b3d53e8a51bbac501946644745eae2119907
          GRANT_BINARY_SHA256: 3e669be258a2b79544cd478287c103fce25a763af85b27ab93a02b129e837837
        run: |
          install_pinned() {
            local name="$1" version="$2" want="$3" installer
            installer="$(mktemp)"
            # Downloaded to a file, not piped: a pipe cannot be checksummed
            # before it is executed, which is the whole point of this step.
            curl -sSfL "https://raw.githubusercontent.com/anchore/${name}/${version}/install.sh" -o "$installer"
            echo "${want}  ${installer}" | sha256sum -c -
            # DOWNLOAD_TAG_INSTALL_SCRIPT defaults to true in all three
            # installers, and under that default the pin above buys nothing:
            # the verified script's FIRST act is to fetch install.sh again from
            # https://get.anchore.io/<tool>/<tag>/install.sh -- a
            # Cloudflare-fronted origin that is not GitHub and that no digest
            # here covers -- pipe it into `sh`, and exit with its status. The
            # bytes that would actually run are whatever that host served, so
            # the checksum would have verified a script that never did the
            # work, and `curl | sh` would be back one level down. Setting it
            # false makes the script we fetched at the tag and checksummed do
            # the install itself; the installer's own reason for re-fetching
            # ("use the install.sh associated with the tagged release") is
            # already satisfied, because that is exactly the file above.
            DOWNLOAD_TAG_INSTALL_SCRIPT=false sh "$installer" -b "$HOME/.local/bin" "${version}"
            rm -f "$installer"
          }
          install_pinned syft "$SYFT_VERSION" "$SYFT_INSTALLER_SHA256"
          install_pinned grype "$GRYPE_VERSION" "$GRYPE_INSTALLER_SHA256"
          install_pinned grant "$GRANT_VERSION" "$GRANT_INSTALLER_SHA256"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # $GITHUB_PATH only applies to LATER steps, so this step checks by path.
          # An installer that exits 0 without leaving a binary would otherwise be
          # discovered by the scan step, as a "command not found" that reads like
          # a different failure.
          for tool in syft grype grant; do
            test -x "$HOME/.local/bin/$tool" || { echo "installer for $tool exited 0 but left no executable"; exit 1; }
          done
          # Link 2 of the comment above: what the installers themselves cannot
          # tell us, because they verify the download against a file fetched
          # beside it.
          binary_sums="$(mktemp)"
          {
            echo "${SYFT_BINARY_SHA256}  ${HOME}/.local/bin/syft"
            echo "${GRYPE_BINARY_SHA256}  ${HOME}/.local/bin/grype"
            echo "${GRANT_BINARY_SHA256}  ${HOME}/.local/bin/grant"
          } > "$binary_sums"
          sha256sum -c "$binary_sums"
          rm -f "$binary_sums"
      - name: Build the Python distributions
        # `uv build` writes a `dist/.gitignore` next to the two distributions.
        # It is not a distribution, and left in place it splits this job's
        # checksum manifest from the artifact the publish job downloads: the
        # `sha256sum dist/*` below runs under `dotglob` and records the dotfile,
        # while upload-artifact excludes hidden files by default and does not
        # ship it. The publish job then passes its "wheel and sdist and nothing
        # else" count -- it sees two -- and fails one step later on
        # `sha256sum -c`, with `dist/.gitignore: No such file or directory`
        # (measured locally on the real chain). That failure lands AFTER the tag
        # is pushed, which is the worst place to discover it. Delete the file
        # here, at the source, so the manifest and the artifact describe the same
        # two files; relaxing either check downstream would weaken the sentence
        # each one exists to say.
        run: |
          uv build
          rm -f dist/.gitignore
      - name: Assert + scan Python
        run: |
          uv run --frozen python tools/assert_artifacts.py --wheel dist/*.whl --sdist dist/*.tar.gz
          uv sync --locked
          syft dir:.venv -o cyclonedx-json=sbom-python.cdx.json
          # An SBOM with no components passes every scan below -- grype finds no
          # vulnerabilities in nothing and grant finds no forbidden licence in
          # nothing -- and is then attached to the GitHub Release as evidence.
          # The gate has to refuse an empty inventory before it can mean anything.
          jq -e '(.components | type) == "array" and (.components | length) > 0' sbom-python.cdx.json > /dev/null \
            || { echo "sbom-python.cdx.json lists no components: the scans below would pass on an empty inventory"; exit 1; }
          # grype is only a gate while it has a current vulnerability database,
          # and nothing here asserts that it does: the property is bought
          # entirely by grype's own defaults (auto-update true, validate-age
          # true, max-allowed-built-age 120h), which make it ERROR rather than
          # report zero findings on a stale or absent database -- a fresh runner
          # has no cache, so it must download or fail. That is fail-closed, but
          # it is upstream's default, not this file's assertion: setting
          # GRYPE_DB_AUTO_UPDATE=false or GRYPE_DB_VALIDATE_AGE=false anywhere
          # in this workflow turns the vulnerability gate into a step that
          # passes on everything. Do not set them. Unmeasured here: what grype
          # reports when the database is present but stale within 120h.
          grype sbom:sbom-python.cdx.json --fail-on high
          grant check -c .grant.yaml sbom-python.cdx.json
      - name: Assert + scan npm
        run: |
          npm ci --prefix verifiers/ts
          npm run build --prefix verifiers/ts
          (cd verifiers/ts && npm pack --json > /tmp/pack.json)
          uv run --frozen python tools/assert_artifacts.py --npm-pack-json /tmp/pack.json
          cp verifiers/ts/attest-verifier-*.tgz .
          (cd verifiers/ts && npm ci --omit=dev)
          syft dir:verifiers/ts -o cyclonedx-json=sbom-npm.cdx.json
          jq -e '(.components | type) == "array" and (.components | length) > 0' sbom-npm.cdx.json > /dev/null \
            || { echo "sbom-npm.cdx.json lists no components: the scans below would pass on an empty inventory"; exit 1; }
          grype sbom:sbom-npm.cdx.json --fail-on high
          grant check -c .grant.yaml sbom-npm.cdx.json
      - name: Assert the artifact is complete, then record what it holds
        # Two claims, in order, because they are different claims and the upload
        # below makes neither.
        #
        # COMPLETE. `if-no-files-found: error` is not this check: it fires only
        # when the TOTAL across every pattern is zero, because the action builds
        # one globber over the whole `path` and tests
        # `filesToUpload.length === 0`. Three patterns matching and a fourth
        # empty is a green upload. Each pattern the publishing jobs depend on has
        # to be present in its own right, and today each is guaranteed only by
        # construction -- by an earlier step in this job that happens to fail
        # first. That is luck, and luck is not a gate.
        #
        # THE BYTES. Everything here is asserted and scanned in THIS job, then
        # travels to the publishing jobs through upload/download, where it is
        # checked by name and by count -- a different claim from "these are the
        # bytes that passed the gate". The desktop verifier has carried its own
        # checksum for exactly this reason; the two distributions that go to PyPI
        # and the tarball that goes to npm, the irreversible ones, had nothing.
        run: |
          shopt -s nullglob dotglob
          VERSION="${GITHUB_REF_NAME#v}"
          missing=()
          for pattern in "dist/*.whl" "dist/*.tar.gz" "sbom-python.cdx.json" \
                         "sbom-npm.cdx.json" "attest-verifier-${VERSION}.tgz"; do
            # A pattern without a wildcard is not a glob: nullglob leaves it as
            # its own literal text, so the array is never empty and `test -e` is
            # what decides. Same trap the dist/ assertion documents.
            matched=($pattern)
            test "${#matched[@]}" -ge 1 && test -e "${matched[0]}" || missing+=("$pattern")
          done
          test "${#missing[@]}" -eq 0 \
            || { echo "the artifact would leave this job without: ${missing[*]}"; exit 1; }
          # The verifier tarball's VERSION is otherwise bound only in the npm
          # job -- which now runs after `pypi`, so a refusal there arrives after
          # PyPI has the release even though the two are no longer concurrent.
          # This job is the last one that runs before anything is published:
          # bind it here.
          # The count matters too, because the checksum line below globs.
          verifiers=(attest-verifier-*.tgz)
          test "${#verifiers[@]}" -eq 1 \
            || { echo "expected exactly 1 verifier tarball, found ${#verifiers[@]}: ${verifiers[*]}"; exit 1; }
          # The manifest below globs dist/ under dotglob and upload-artifact
          # ships no hidden file, so anything here the artifact will not carry
          # splits the two and fails `sha256sum -c` in the publish job -- after
          # the tag is pushed. `uv build`'s `.gitignore` is deleted at the source
          # above; this refuses the NEXT one here, where a re-run is free,
          # instead of discovering it there. It is the same sentence the pypi
          # job already says about the downloaded artifact, said about the bytes
          # that produce it.
          shipped=(dist/*)
          test "${#shipped[@]}" -eq 2 \
            || { echo "dist/ must hold only the wheel and the sdist before the manifest is written, found ${#shipped[@]}: ${shipped[*]}"; exit 1; }
          # Bind both Python filenames here too: `pypi` runs before `npm`, so a
          # refusal there stops npm -- but not a PyPI upload this job authorized.
          sdist="dist/attest_receipts-${VERSION}.tar.gz"
          wheels=(dist/attest_receipts-"${VERSION}"-*.whl)
          test -f "$sdist" && test "${#wheels[@]}" -eq 1 && test -f "${wheels[0]}" \
            || { echo "Python distributions must match ${VERSION}: ${shipped[*]}"; exit 1; }
          sha256sum dist/* sbom-python.cdx.json sbom-npm.cdx.json attest-verifier-*.tgz \
            | tee gated-artifacts.sha256
          # Same idiom as the desktop job: prove the file we ship is one that
          # `sha256sum -c` accepts, here, rather than downstream.
          sha256sum -c gated-artifacts.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-and-sboms
          # Default is `warn`: nothing found is a warning and the step stays
          # green. `error` fixes only THAT -- it is aggregate over every pattern
          # (one globber, `filesToUpload.length === 0`), so it is not what makes
          # the artifact complete. The step above is.
          if-no-files-found: error
          path: |
            dist/*
            sbom-python.cdx.json
            sbom-npm.cdx.json
            attest-verifier-*.tgz
            gated-artifacts.sha256

  desktop:
    # Its own job, not a step inside `build`: that job reinstalls verifiers/ts with
    # --omit=dev halfway through, and a build that depends on the leftovers of
    # someone else's node_modules is a build that breaks on a day nobody touched it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Nothing here pushes; `gh` authenticates with GH_TOKEN and only needs
          # the remote to name the repository. Leaving the token in
          # .git/config puts it within reach of every dependency lifecycle
          # script this job runs afterwards.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            verifiers/ts/package-lock.json
            site/package-lock.json
            desktop/package-lock.json
      - run: npm ci --prefix verifiers/ts
      - run: npm run build --prefix verifiers/ts
      # The desktop build typechecks ../site/src along with its own sources, so the
      # site's modules have to be installed even though nothing here builds the site.
      - run: npm ci --prefix site
      - run: npm ci --prefix desktop
      - run: npm run build --prefix desktop
      - name: Write the checksum the artifact's own footer promises
        # The file tells the reader its SHA-256 is listed beside the download and
        # that `sha256sum` will confirm it. That sentence is only true if this runs.
        # The line names the FILE, never the path it was built at: it is checked
        # next to a download, where `desktop/dist/` does not exist. `-c` here proves
        # the line we publish is one `sha256sum -c` actually accepts.
        run: |
          cd desktop/dist
          sha256sum attest-verifier.html | tee attest-verifier.html.sha256
          sha256sum -c attest-verifier.html.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-verifier
          # Catches only a wholly empty upload (the key is aggregate). Both files
          # are already guaranteed by the `sha256sum -c` step above, which cannot
          # succeed unless the html exists and the .sha256 was written from it.
          if-no-files-found: error
          path: |
            desktop/dist/attest-verifier.html
            desktop/dist/attest-verifier.html.sha256

  pypi:
    # Finish local gates before publishing. Prove PyPI's bytes before npm starts;
    # each publish job recalculates its own registry state on every attempt.
    # Recovery: fix an external registry/OIDC/network failure, then choose
    # "Re-run failed jobs" on the original run within 30 days, while its
    # dist-and-sboms artifact is retained. Never re-tag, rebuild, or re-run all jobs.
    # A defect in the tagged workflow or divergent bytes requires the next patch.
    # A half-created GitHub Release still needs manual deletion before resuming.
    needs: [build, desktop]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-and-sboms
          path: .
      - name: Assert dist/ holds exactly this tag's two distributions
        # This replaces a `mkdir -p dist` / `mv … 2>/dev/null || true` / `ls dist/`
        # which could not fail -- and which, it turns out, never moved anything.
        # The build job uploads several path patterns, so the artifact's root is
        # the workspace and the distributions arrive already under `dist/`. The
        # `mv` looked for them in the root, where they have never been: it failed
        # on every release, said nothing, and `ls` then listed what the download
        # had already put in place. A step that works for a reason other than the
        # one it states is a step nobody can reason about.
        #
        # What must hold before the next step publishes irreversibly: one wheel
        # and one sdist, both carrying THIS tag's version, and nothing else. The
        # old step's worst case was not an empty dist/ (twine refuses that) but a
        # half-populated one: rename the wheel by a single character upstream and
        # the sdist alone would go to PyPI, with every job green.
        run: |
          # dotglob too: without it `dist/*` skips dotfiles, and "nothing else"
          # below would be a stronger sentence than the glob backing it.
          shopt -s nullglob dotglob
          VERSION="${GITHUB_REF_NAME#v}"
          everything=(dist/*)
          sdist="dist/attest_receipts-${VERSION}.tar.gz"
          # `test -f`, not an array: a pattern with no wildcard is not a glob, so
          # nullglob leaves it as its own literal text and an array would count a
          # file that does not exist as one match.
          wheels=(dist/attest_receipts-"${VERSION}"-*.whl)
          test -f "$sdist" \
            || { echo "expected sdist ${sdist}; dist/ holds ${#everything[@]}: ${everything[*]}"; exit 1; }
          test "${#wheels[@]}" -eq 1 \
            || { echo "expected exactly 1 wheel for ${VERSION}, found ${#wheels[@]}: ${wheels[*]}"; exit 1; }
          test "${#everything[@]}" -eq 2 \
            || { echo "dist/ must hold the wheel and the sdist and nothing else, found ${#everything[@]}: ${everything[*]}"; exit 1; }
          echo "publishing ${wheels[0]} and ${sdist}"
      - name: Verify the distributions are the bytes the build job gated
        # The step above proves dist/ holds two files with the right names. Names
        # are not bytes, and the next step is irreversible.
        run: sha256sum -c gated-artifacts.sha256
      - name: Preflight PyPI against the gated bytes
        id: preflight
        env:
          REGISTRY_ATTEMPTS: "10"
          REGISTRY_RETRY_SECONDS: "15"
          REGISTRY_PHASE: preflight
        # Reuse the parser for the post-publish check, with fresh network requests.
        run: &pypi_registry_check |
          python3 - <<'PYCODE'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          phase = os.environ["REGISTRY_PHASE"]
          if phase not in {"preflight", "verify"}:
              raise SystemExit("cannot determine: invalid registry phase")
          attempts = int(os.environ["REGISTRY_ATTEMPTS"])
          delay = int(os.environ["REGISTRY_RETRY_SECONDS"])
          if attempts < 1 or delay < 0:
              raise SystemExit("cannot determine: invalid retry budget")

          registry = "PyPI"
          subprocess.run(["sha256sum", "-c", "gated-artifacts.sha256"], check=True)
          files = sorted(Path("dist").iterdir())
          if (
              len(files) != 2
              or not Path(f"dist/attest_receipts-{version}.tar.gz").is_file()
              or len(list(Path("dist").glob(f"attest_receipts-{version}-*.whl"))) != 1
              or not all(file.is_file() for file in files)
          ):
              raise SystemExit("cannot determine: expected this tag's wheel and sdist")
          wanted = {file.name: hashlib.sha256(file.read_bytes()).hexdigest() for file in files}


          def fetch(url, accept="application/json"):
              # Do not use -f: 404 confirms absence; 5xx and transport errors never do.
              with tempfile.TemporaryDirectory() as directory:
                  body = Path(directory) / "response.json"
                  response = subprocess.run(
                      [
                          "curl",
                          "-sSL",
                          "--connect-timeout",
                          "10",
                          "--max-time",
                          "30",
                          "-H",
                          f"Accept: {accept}",
                          "-o",
                          str(body),
                          "-w",
                          "%{http_code}",
                          url,
                      ],
                      capture_output=True,
                      text=True,
                      check=False,
                  )
                  if response.returncode != 0:
                      raise ValueError(f"transport failure ({response.returncode})")
                  if response.stdout == "404":
                      return None
                  if response.stdout != "200":
                      raise ValueError(f"HTTP {response.stdout}")
                  document = json.loads(body.read_text())
                  if not isinstance(document, dict):
                      raise ValueError("expected a JSON object")
                  return document


          def entries(document, field, digest_field):
              if document is None:
                  return {}
              rows = document[field]
              if not isinstance(rows, list):
                  raise ValueError(f"{field} must be a list")
              result = {}
              for row in rows:
                  name = row["filename"]
                  digest = row[digest_field]["sha256"]
                  if (
                      not isinstance(name, str)
                      or not isinstance(digest, str)
                      or not re.fullmatch(r"[0-9a-f]{64}", digest)
                  ):
                      raise ValueError("invalid filename or sha256")
                  if name in result and result[name] != digest:
                      raise ValueError(f"conflicting duplicate filename: {name}")
                  result[name] = digest
              return result


          def observe():
              primary = entries(
                  fetch(f"https://pypi.org/pypi/attest-receipts/{version}/json"), "urls", "digests"
              )
              # Check both surfaces, including a 200 missing just one file: caches can omit it.
              secondary = entries(
                  fetch("https://pypi.org/simple/attest-receipts/", "application/vnd.pypi.simple.v1+json"),
                  "files",
                  "hashes",
              )
              return {
                  name: [surface[name] for surface in (primary, secondary) if name in surface]
                  for name in wanted
              }


          for attempt in range(1, attempts + 1):
              try:
                  observed = observe()
                  present = 0
                  for name, want in wanted.items():
                      values = observed[name]
                      for got in values:
                          if got != want:
                              print(f"{registry} already serves {name} as {got}, this run gated {want}.")
                              print(
                                  f"Version {version} is burned on {registry}: published files cannot be replaced, even after deletion."
                              )
                              print(
                                  "Do not move the tag and do not re-run this workflow against it. Release the next patch version."
                              )
                              raise SystemExit(1)
                      present += bool(values)
                  state = "absent" if present == 0 else "identical" if present == len(wanted) else "partial"
                  if phase == "preflight":
                      # No *_STATE environment input: this attempt's observations alone authorize publication.
                      with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                          output.write(f"state={state}\n")
                      print(f"{registry} preflight: {state}")
                      break
                  if state == "identical":
                      print(f"{registry} serves the bytes this run gated")
                      if os.environ["PREFLIGHT_RESULT"] == "identical":
                          for name in wanted:
                              print(
                                  f"{registry} already served the gated bytes for {name}: resumed, not republished"
                              )
                      break
                  reason = f"{registry} does not serve all gated files for {version}"
              except (ValueError, KeyError, TypeError, OSError) as error:
                  reason = f"cannot determine {registry} {version}: {error}"
              print(f"attempt {attempt}/{attempts}: {reason}")
              if attempt < attempts:
                  time.sleep(delay)
          else:
              print(reason)
              raise SystemExit(1)
          PYCODE
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        # Trusted Publishing (OIDC) + PEP 740 attestations are on by default.
        with:
          # Skip only files this job's preflight has just proved identical.
          # The post-publish check catches stale absence and closes the npm gate.
          skip-existing: true
      - name: Assert PyPI serves the bytes this run gated
        env:
          REGISTRY_ATTEMPTS: "10"
          REGISTRY_RETRY_SECONDS: "15"
          REGISTRY_PHASE: verify
          PREFLIGHT_RESULT: ${{ steps.preflight.outputs.state }}
        run: *pypi_registry_check

  npm:
    needs: [build, desktop, pypi]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # npm trusted publishing (OIDC) requires Node >= 22.14.0 AND npm >= 11.5.1
          # (docs.npmjs.com/trusted-publishers); Node 20 fails even with npm upgraded.
          node-version: 22.14.0
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm to a Trusted-Publishing-capable version (>=11.5.1)
        run: |
          npm install -g npm@11.18.0
          npm --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-and-sboms
          path: dist-and-sboms
      - name: Verify the tarball is the bytes the build job gated
        run: (cd dist-and-sboms && sha256sum -c gated-artifacts.sha256)
      - name: Preflight npm against the gated bytes
        id: preflight
        env:
          REGISTRY_ATTEMPTS: "10"
          REGISTRY_RETRY_SECONDS: "15"
          REGISTRY_PHASE: preflight
        # Reuse the parser for the post-publish check, with fresh network requests.
        run: &npm_registry_check |
          python3 - <<'PYCODE'
          import base64
          import hashlib
          import json
          import os
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          phase = os.environ["REGISTRY_PHASE"]
          if phase not in {"preflight", "verify"}:
              raise SystemExit("cannot determine: invalid registry phase")
          attempts = int(os.environ["REGISTRY_ATTEMPTS"])
          delay = int(os.environ["REGISTRY_RETRY_SECONDS"])
          if attempts < 1 or delay < 0:
              raise SystemExit("cannot determine: invalid retry budget")

          registry = "npm"
          root = Path("dist-and-sboms")
          subprocess.run(["sha256sum", "-c", "gated-artifacts.sha256"], cwd=root, check=True)
          tarball = root / f"attest-verifier-{version}.tgz"
          if not tarball.is_file() or len(list(root.glob("attest-verifier-*.tgz"))) != 1:
              raise SystemExit("cannot determine: expected this tag's single tarball")
          wanted = {
              tarball.name: "sha512-"
              + base64.b64encode(hashlib.sha512(tarball.read_bytes()).digest()).decode()
          }


          def fetch(url, accept="application/json"):
              # Do not use -f: 404 confirms absence; 5xx and transport errors never do.
              with tempfile.TemporaryDirectory() as directory:
                  body = Path(directory) / "response.json"
                  response = subprocess.run(
                      [
                          "curl",
                          "-sSL",
                          "--connect-timeout",
                          "10",
                          "--max-time",
                          "30",
                          "-H",
                          f"Accept: {accept}",
                          "-o",
                          str(body),
                          "-w",
                          "%{http_code}",
                          url,
                      ],
                      capture_output=True,
                      text=True,
                      check=False,
                  )
                  if response.returncode != 0:
                      raise ValueError(f"transport failure ({response.returncode})")
                  if response.stdout == "404":
                      return None
                  if response.stdout != "200":
                      raise ValueError(f"HTTP {response.stdout}")
                  document = json.loads(body.read_text())
                  if not isinstance(document, dict):
                      raise ValueError("expected a JSON object")
                  return document


          def integrity(document):
              if document is None:
                  return []
              if document["version"] != version:
                  raise ValueError("npm document has the wrong version")
              value = document["dist"]["integrity"]
              if not isinstance(value, str) or not value:
                  raise ValueError("dist.integrity must be a nonempty string")
              return [value]


          def observe():
              primary = integrity(fetch(f"https://registry.npmjs.org/attest-verifier/{version}"))
              packument = fetch("https://registry.npmjs.org/attest-verifier")
              secondary = []
              if packument is not None:
                  versions = packument["versions"]
                  if not isinstance(versions, dict):
                      raise ValueError("versions must be an object")
                  if version in versions:
                      if not isinstance(versions[version], dict):
                          raise ValueError("version entry must be an object")
                      secondary = integrity(versions[version])
              return {tarball.name: primary + secondary}


          for attempt in range(1, attempts + 1):
              try:
                  observed = observe()
                  present = 0
                  for name, want in wanted.items():
                      values = observed[name]
                      for got in values:
                          if got != want:
                              print(f"{registry} already serves {name} as {got}, this run gated {want}.")
                              print(
                                  f"Version {version} is burned on {registry}: published files cannot be replaced, even after deletion."
                              )
                              print(
                                  "Do not move the tag and do not re-run this workflow against it. Release the next patch version."
                              )
                              raise SystemExit(1)
                      present += bool(values)
                  state = "absent" if present == 0 else "identical" if present == len(wanted) else "partial"
                  if phase == "preflight":
                      # No *_STATE environment input: this attempt's observations alone authorize publication.
                      with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                          output.write(f"state={state}\n")
                      print(f"{registry} preflight: {state}")
                      break
                  if state == "identical":
                      print(f"{registry} serves the bytes this run gated")
                      if os.environ["PREFLIGHT_RESULT"] == "identical":
                          for name in wanted:
                              print(
                                  f"{registry} already served the gated bytes for {name}: resumed, not republished"
                              )
                      break
                  reason = f"{registry} does not serve all gated files for {version}"
              except (ValueError, KeyError, TypeError, OSError) as error:
                  reason = f"cannot determine {registry} {version}: {error}"
              print(f"attempt {attempt}/{attempts}: {reason}")
              if attempt < attempts:
                  time.sleep(delay)
          else:
              print(reason)
              raise SystemExit(1)
          PYCODE
      - name: Publish with provenance (OIDC Trusted Publishing)
        if: steps.preflight.outputs.state == 'absent'
        # Publish the exact tarball asserted + scanned in the build job, not a fresh pack.
        run: |
          shopt -s nullglob dotglob
          VERSION="${GITHUB_REF_NAME#v}"
          # Bytes first: the tarball was asserted and scanned in another job.
          (cd dist-and-sboms && sha256sum -c gated-artifacts.sha256)
          # Then the version. A count of 1 says nothing about WHICH version was
          # packed: a single stale attest-verifier-<older>.tgz satisfied it and
          # would have been published irreversibly under this tag, with the
          # mismatch surfacing only in the release job, after the fact. The
          # pypi job has always pinned the version here; this one had not.
          tarball="dist-and-sboms/attest-verifier-${VERSION}.tgz"
          present=(dist-and-sboms/attest-verifier-*.tgz)
          test -f "$tarball" \
            || { echo "expected the gated tarball ${tarball}; found ${#present[@]}: ${present[*]}"; exit 1; }
          test "${#present[@]}" -eq 1 \
            || { echo "expected exactly 1 gated tarball, found ${#present[@]}: ${present[*]}"; exit 1; }
          # Prefix "./" so npm treats the arg as a local tarball file, not a
          # package spec: a bare "dist-and-sboms/..." path is parsed as a git
          # <owner>/<repo> shorthand and npm tries to `git ls-remote` it.
          npm publish "./${tarball}" --provenance

      - name: Assert npm serves the bytes this run gated
        env:
          REGISTRY_ATTEMPTS: "10"
          REGISTRY_RETRY_SECONDS: "15"
          REGISTRY_PHASE: verify
          PREFLIGHT_RESULT: ${{ steps.preflight.outputs.state }}
        run: *npm_registry_check

  github-release:
    needs: [pypi, npm, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Nothing here pushes; `gh` authenticates with GH_TOKEN and only needs
          # the remote to name the repository. Leaving the token in
          # .git/config puts it within reach of every dependency lifecycle
          # script this job runs afterwards.
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-and-sboms
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-verifier
          path: desktop-verifier
      - name: Assert both registries serve what this release is about to announce
        # The notes below name attest-receipts and attest-verifier at this
        # version, and a GitHub Release is the public face of the whole run.
        # Nothing checked that the registries had actually received them: a pypi
        # job that published a partial dist/ still exits green, and this job would
        # announce the version anyway. This is the last step that can refuse, and
        # the only one that sees both registries.
        #
        # It runs BEFORE `gh release create`, so a registry that never catches up
        # leaves no half-made release for the re-run to trip over. The two knobs
        # exist so the retry can be exercised without waiting; neither can turn a
        # missing package into a pass. They are declared here rather than read
        # from whatever the runner happens to export: a release-critical step
        # that takes its retry budget from the ambient environment is one
        # repository-level `env:` away from being tuned from outside the file.
        env:
          REGISTRY_ATTEMPTS: "10"
          REGISTRY_RETRY_SECONDS: "15"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          attempts="${REGISTRY_ATTEMPTS:-10}"
          delay="${REGISTRY_RETRY_SECONDS:-15}"
          pypi_url="https://pypi.org/pypi/attest-receipts/${VERSION}/json"
          npm_url="https://registry.npmjs.org/attest-verifier/${VERSION}"
          served=0
          for attempt in $(seq 1 "$attempts"); do
            if curl -sSfL "$pypi_url" -o pypi.json && curl -sSfL "$npm_url" -o npm.json; then
              served=1
              break
            fi
            echo "attempt ${attempt}/${attempts}: a registry does not serve ${VERSION} yet"
            # No wait after the final attempt: it delays the refusal without
            # buying another chance for the registries to catch up.
            test "$attempt" -eq "$attempts" || sleep "$delay"
          done
          test "$served" -eq 1 \
            || { echo "PyPI or npm does not serve ${VERSION} after ${attempts} attempts; not announcing it"; exit 1; }
          # Present is not enough: the release claims a wheel AND an sdist, which
          # is exactly the pair a half-populated dist/ would have broken.
          jq -e '[.urls[].packagetype] | (index("bdist_wheel") != null) and (index("sdist") != null)' pypi.json > /dev/null \
            || { echo "PyPI serves ${VERSION} without both a wheel and an sdist: $(jq -c '[.urls[].filename]' pypi.json)"; exit 1; }
          jq -e --arg v "$VERSION" '.version == $v' npm.json > /dev/null \
            || { echo "npm does not serve attest-verifier ${VERSION}"; exit 1; }
          echo "registries serve ${VERSION}: announcing it"
      - name: Assert the registries serve the bytes this run gated
        # The step above proves the registries hold SOMETHING at this version
        # with the right shape. It cannot tell that something apart from these
        # bytes, and `skip-existing: true` -- which this workflow wants, so a
        # re-run is not blocked by its own first attempt -- makes the difference
        # reachable: if the version was already on PyPI the publish step skips
        # in silence, and a presence check is satisfied by whatever was there.
        # The notes below would then announce, over this run's SBOMs, a version
        # this run built, scanned and never published.
        #
        # PyPI's per-version JSON carries digests.sha256 per file; npm's version
        # document carries dist.integrity, which is sha512-<base64> over the
        # served tarball. Both are compared against the artifact the build job
        # asserted and scanned, which this job already holds on disk.
        run: |
          shopt -s nullglob dotglob
          VERSION="${GITHUB_REF_NAME#v}"
          (cd artifacts && sha256sum -c gated-artifacts.sha256)
          dists=(artifacts/dist/*)
          test "${#dists[@]}" -eq 2 \
            || { echo "expected the wheel and the sdist, found ${#dists[@]}: ${dists[*]}"; exit 1; }
          for dist_file in "${dists[@]}"; do
            name="$(basename "$dist_file")"
            want="$(sha256sum "$dist_file" | cut -d' ' -f1)"
            got="$(jq -r --arg f "$name" 'first(.urls[] | select(.filename == $f) | .digests.sha256) // ""' pypi.json)"
            test "$got" = "$want" \
              || { echo "PyPI serves ${name} as ${got:-<no such file>}, this run gated ${want}"; exit 1; }
          done
          tarball="artifacts/attest-verifier-${VERSION}.tgz"
          test -f "$tarball" || { echo "no gated tarball at ${tarball}"; exit 1; }
          want="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          got="$(jq -r '.dist.integrity // ""' npm.json)"
          test "$got" = "$want" \
            || { echo "npm serves attest-verifier ${VERSION} as ${got:-<absent>}, this run gated ${want}"; exit 1; }
          echo "both registries serve the bytes this run gated"
      - name: Create GitHub Release with SBOMs and the offline verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-checked against the bytes about to be uploaded: between the two jobs
          # the file travelled through upload and download, and a checksum that was
          # never verified against what is published is a promise nobody kept.
          (cd desktop-verifier && sha256sum -c attest-verifier.html.sha256)
          gh release create "${GITHUB_REF_NAME}" \
            --title "attest ${GITHUB_REF_NAME}" \
            --notes "attest-receipts and attest-verifier ${GITHUB_REF_NAME}. See CHANGELOG.md and verifiers/ts/CHANGELOG.md. CycloneDX SBOMs attached. attest-verifier.html verifies a receipt offline: download it together with its .sha256, confirm it with \`sha256sum -c attest-verifier.html.sha256\`, and open it by double-click." \
            artifacts/sbom-python.cdx.json \
            artifacts/sbom-npm.cdx.json \
            desktop-verifier/attest-verifier.html \
            desktop-verifier/attest-verifier.html.sha256
