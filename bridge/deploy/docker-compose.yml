# One-command self-hosted deploy (a VPS, a home server, ...). Run from the
# REPO ROOT: `docker compose -f bridge/deploy/docker-compose.yml up -d`
# (the build context is the repo root — see bridge/deploy/Dockerfile).
#
# Before the first `up`, next to this file (bridge/deploy/):
#   mkdir -p etc secrets
#   cp <your bridge.toml> <your key-manifest.json> etc/
#   cp <your issuer.seed> <your issuer.mldsa.json> secrets/
#   printf 'STRIPE_WEBHOOK_SECRET=whsec_...\n' > .env   # + STRIPE_API_KEY / ITCH_API_KEY / SMTP_PASSWORD, whichever your bridge.toml references
#   chmod 600 .env
#   sudo chown -R 10001:10001 etc secrets   # the unprivileged uid the bridge runs as
#
# That last line is not optional: the bridge runs as uid 10001 (see
# bridge/docs/deploy.md), your host has no such account, and these two
# directories are bind-mounted read-only — the container cannot fix their
# ownership from the inside. The Ledger volume below needs nothing: Docker
# creates it from the image's own directory, ownership included.
#
# See bridge/docs/setup-stripe.md and bridge/docs/deploy.md for the full walkthrough.
services:
  attest-bridge:
    build:
      context: ../..
      dockerfile: bridge/deploy/Dockerfile
    ports:
      # Loopback only — the bridge speaks plain HTTP, and a webhook body /
      # downloaded receipt both carry a buyer-binding salt (a secret in
      # transit). Put a TLS-terminating reverse proxy (Caddy, nginx, or a
      # tunnel) in front of this on the public interface; never publish
      # 8080 on "0.0.0.0"/all interfaces directly.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./etc:/etc/attest-bridge:ro    # bridge.toml + key-manifest.json
      - ./secrets:/secrets:ro          # issuer.seed + issuer.mldsa.json (0600 on the host)
      - ledger-data:/var/lib/attest-bridge   # Ledger database + WAL sidecars — the only writable mount
    env_file:
      - .env
    restart: unless-stopped

volumes:
  ledger-data:
