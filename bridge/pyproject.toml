[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "attest-bridge"
version = "0.1.0"
description = "attest-bridge — turns a store into a receipt issuer: self-hosted, next to checkout, no code required (UNRELEASED)"
requires-python = ">=3.12"
dependencies = ["attest-receipts>=0.4.0"]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
attest-bridge = "attest_bridge.cli:main"

[tool.uv.sources]
attest-receipts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/attest_bridge"]
