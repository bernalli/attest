# Secret scanning for this repository.
#
# The default rule set runs unchanged. This file exists for one reason: to name
# a single false positive precisely enough that scanning stays ON everywhere
# else. An allowlist that silenced a rule, a file, or a directory would be the
# wrong trade — the point of the scan is the secret nobody meant to commit.
title = "attest"

[extend]
useDefault = true

# `generic-api-key` is keyword-driven: it fires on an assignment whose target
# contains "key", and `log_keys_path = ed25519_key.parent / "log-keys.pinned.json"`
# has three of them while holding no key material at all — the value is a
# FILENAME. The real key material this repository touches is generated at run
# time and written outside the working tree (tools/gen_site_sample.py), which
# is why there is nothing else here to exempt.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "a path built from a variable whose name contains 'key'"
condition = "AND"
paths = ['''tools/gen_site_sample\.py''']
regexes = ['''^ed25519_key\.parent$''']

# The same rule fires on tools/test-census.json, and for the same shape of reason:
# one of the test files it pins is named `c57-findkey-type-guard.test.ts`, so the
# JSON member NAME contains "key", and the value beside it is a 64-character hex
# digest with the entropy of a secret. It is a sha256 over that file's test names
# (tools/check_test_census.py, `name_digest`) — derived from the repository's own
# public content, reproducible by anyone who runs the suite. The exemption is
# constrained to a complete test-file digest member on a line in this exact file.
# This recognizes syntax, not provenance; unrelated members remain scanned.
[[rules.allowlists]]
description = "sha256 of a test file's test names, pinned by the suite census"
condition = "AND"
paths = ['''(^|/)tools/test-census\.json$''']
regexTarget = "line"
regexes = ['''^\s*"[^"\r\n]*\.(test|spec)\.(ts|tsx|mts|cts|js|jsx|mjs|cjs)"\s*:\s*"[0-9a-f]{64}"\s*,?\s*$''']

# And a third time, in a conformance vector. The member is named `token_b64`, so
# the keyword rule fires, and base64 of anything has the entropy of a secret. The
# value decodes to the ASCII string `attest-vectors-28k-fake-tsa-token`: the
# vector exists to pin how a verifier treats an RFC 3161 timestamp it cannot
# validate, so the token must be present and must NOT be a real one. Nothing is
# hidden here that is not already public — this file has been on the default
# branch since the vector was added.
#
# Why the exemption is shaped this way: it names ONE file and ONE member. A
# second vector that needs the same thing gets its own line, deliberately, rather
# than a `docs/spec/vectors/**` wildcard that would stop scanning the one corpus
# an outside contributor can add files to. Every other member of this same file
# remains scanned.
[[rules.allowlists]]
description = "a deliberately fake RFC 3161 token, carried by the vector that pins unvalidatable timestamps"
condition = "AND"
paths = ['''(^|/)docs/spec/vectors/28-transparency/k-rfc3161-only/transparency\.json$''']
regexTarget = "line"
regexes = ['''^\s*"token_b64"\s*:\s*"[A-Za-z0-9+/]+={0,2}"\s*,?\s*$''']
