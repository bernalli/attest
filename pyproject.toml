[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "attest-receipts"
version = "0.9.3"
description = "attest reference implementation: durable, portable proof of purchase you hold — the seller signs a receipt, you keep the file, anyone verifies it offline after the store is gone."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Samuele Martinalli" }]
keywords = ["digital-ownership", "purchase-receipts", "receipts", "offline-verification", "ed25519", "consumer-protection", "drm-free", "digital-goods"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = ["pynacl>=1.5", "jsonschema>=4.21", "pqcrypto==0.4.0"]

[project.urls]
Homepage = "https://attest-receipts.org/"
Repository = "https://github.com/bernalli/attest"
Documentation = "https://github.com/bernalli/attest/blob/main/docs/spec/attest-v0.2.md"
Issues = "https://github.com/bernalli/attest/issues"
Funding = "https://github.com/sponsors/bernalli"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "hypothesis>=6", "ruff", "mypy", "dilithium-py>=1.4", "pyyaml>=6"]

[project.scripts]
attest = "attest.cli:main"

[tool.hatch.build.targets.sdist]
# Both exclusions keep operator-side components out of the library's own
# distribution. The reference witness is an OPERATOR's component: its source
# carries the shape of a deployment, its example config names key files, and
# v0.2 §11.4 requires it to be excluded from both public package artifacts.
# The bridge is a MERCHANT's component and a separate distribution of its own
# (attest-bridge, with its own pyproject.toml): shipping it inside this sdist
# put 44 files of deployment source and webhook test fixtures into a library
# that never imports any of them (measured: 860 members before, 816 after).
# hatchling's sdist default is
# "everything not gitignored", so without this line publishing the library
# would publish both with it.
exclude = ["/witness", "/bridge"]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "tools/sdist_files.py"

[tool.hatch.build.targets.wheel]
# Distribution name (attest-receipts) differs from the import package (attest),
# so hatchling cannot infer the package directory on its own.
packages = ["src/attest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = ["S101"]  # assert in tests

[tool.ruff.lint.per-file-ignores]
# The witness test tree IMPORTS its fixtures instead of inheriting them from a
# conftest.py: a second conftest.py in a non-package test tree becomes a second
# top-level module named `conftest` and hijacks `bridge/tests`' own
# `from conftest import ...` (measured — it broke nine bridge modules at
# collection). A test then takes a fixture as a parameter of the same name it
# imported, which is precisely what F811 flags. Scoped to this directory so a
# genuine redefinition anywhere else still fails the gate.
"witness/tests/*" = ["F811"]

# CORE_CSS is deliberately minified: it is inlined into the README.html of
# every exported bundle, so each byte is paid again on every copy of every
# receipt, and a byte ceiling is asserted in the test suite. Line breaks added
# for the linter's benefit would be bytes charged to buyers. Scoped to this one
# file so long lines anywhere else still fail the gate.
"src/attest/buyer_surface.py" = ["E501"]
"tools/gen_buyer_pages.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
# Lets standalone `mypy --strict tools/<script>.py` invocations (e.g. gen_site_sample.py)
# resolve `attest` as first-party typed source rather than through the installed package.
mypy_path = "src"

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pqcrypto.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "bridge/tests", "witness/tests"]
# The repository root, so `tools/` imports resolve from every test tree rather
# than from one of them by accident. `tests/` is a package, so collecting it
# put the root on sys.path and everything else inherited that — which held
# only as long as the whole suite ran in one invocation and `tests/` came
# first. `uv run pytest witness/tests/...` alone then failed at collection
# with "No module named 'tools'", and a CI split into per-tree jobs would fail
# the same way. Stated here it no longer depends on the order.
pythonpath = ["."]

[tool.uv.workspace]
members = ["bridge", "witness"]
